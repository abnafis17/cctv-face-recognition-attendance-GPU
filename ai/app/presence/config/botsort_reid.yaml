# BoTSORT tracker profile tuned for CCTV body persistence.
# Compatible with Ultralytics tracker config format.

tracker_type: botsort

# Association thresholds
track_high_thresh: 0.30
track_low_thresh: 0.08
new_track_thresh: 0.30
match_thresh: 0.80

# Keep ids stable across short occlusions / frame drops
track_buffer: 60
fuse_score: true

# Global motion compensation
gmc_method: sparseOptFlow

# Appearance-assisted association (when supported by current Ultralytics build)
proximity_thresh: 0.55
appearance_thresh: 0.25
with_reid: true

# ReID model shortcut. Ultralytics accepts "auto" on modern releases.
# If your environment requires explicit weights, override with:
# BODY_PERSIST_BOTSORT_TRACKER_YAML=/abs/path/custom.yaml
model: auto
